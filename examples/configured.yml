name: AI Review (Configured)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AI Review Verifier
        uses: ccx-330/ai-review-verifier@v0.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: true
